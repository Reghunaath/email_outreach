<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Fill Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 480px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }
    p.sub {
      font-size: 12px;
      color: #a6adc8;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cdd6f4;
    }
    label .hint {
      font-weight: 400;
      color: #6c7086;
    }
    .field { margin-bottom: 16px; }
    input, textarea {
      width: 100%;
      padding: 9px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #cdd6f4;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 6px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder, textarea::placeholder { color: #585b70; }
    input:hover, textarea:hover { border-color: #45475a; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #89b4fa;
      box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.25);
    }
    textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
    button {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #1e1e2e;
      transition: background 0.15s;
    }
    button:hover { background: #74c7ec; }
    button:focus-visible { outline: 2px solid #cdd6f4; outline-offset: 2px; }
    button:disabled { background: #45475a; color: #6c7086; cursor: default; }
    .row { display: flex; align-items: center; gap: 12px; }
    #status {
      font-size: 12px;
      min-height: 16px;
      color: #a6e3a1;
    }
    #status.error { color: #f38ba8; }
    #status.muted { color: #6c7086; }
    #form { display: none; }
    #loading { font-size: 13px; color: #6c7086; }
  </style>
</head>
<body>
  <h1>AI Fill Settings</h1>
  <p class="sub">Used to fill free-text fields on AshbyHQ application pages. Your Gemini API key
    and profile are stored locally in this browser only.</p>

  <div id="loading">Loading settings…</div>

  <div id="form">
    <div class="field">
      <label for="apiKey">Gemini API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false"
             placeholder="AIza…">
    </div>

    <div class="field">
      <label for="model">Model <span class="hint">— default gemini-flash-latest</span></label>
      <input id="model" type="text" autocomplete="off" spellcheck="false"
             placeholder="gemini-flash-latest">
    </div>

    <div class="field">
      <label for="profile">Your profile <span class="hint">— background, experience, skills the AI should draw on</span></label>
      <textarea id="profile" spellcheck="false"
                placeholder="Paste your resume text or a summary of your background, experience, skills, and what you're looking for…"></textarea>
    </div>

    <div class="row">
      <button id="saveBtn">Save</button>
      <span id="status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
