<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #cdd6f4;
      letter-spacing: 0.3px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #1e1e2e;
      transition: background 0.15s;
    }
    button:hover { background: #74c7ec; }
    button:disabled { background: #45475a; color: #6c7086; cursor: default; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #a6e3a1;
      text-align: center;
      min-height: 16px;
    }
    #status.error { color: #f38ba8; }
  </style>
</head>
<body>
  <h2>LinkedIn URL Collector</h2>
  <button id="copyBtn">Copy LinkedIn URLs</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
